name: Update calendar

on:
  schedule:
    - cron: "*/5 * * * *" # every 5 min (GitHub may run it a few minutes late)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python filter.py
      # Committing keeps the repo active so GitHub doesn't pause the schedule.
      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ff_*.ics cache
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update calendar" && git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Pushes made by the workflow don't trigger a Pages build, so deploy here.
      - if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/configure-pages@v5
      - if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deploy
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4
